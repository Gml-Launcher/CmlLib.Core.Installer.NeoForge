# Minor/patch updates are auto-merged by .github/workflows/dependabot-auto-merge.yml; major updates stay as PRs for review.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"
